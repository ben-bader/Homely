name: mobile
description: "Homely - Real Estate SaaS Platform Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http_parser: ^4.0.2
  # UI & Icons
  cupertino_icons: ^1.0.6

  flutter_riverpod: ^2.5.1
  chewie: ^1.8.5
  
  # HTTP & Networking
  http: ^1.2.0
  dio: ^5.4.0


  stomp_dart_client: ^3.0.1



  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  
  # Local Storage & Cache
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Image Handling
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  photo_view: ^0.14.0
  
  # JSON & Serialization
  json_annotation: ^4.8.1
  
  # Navigation
  go_router: ^13.0.0
  app_links: ^7.0.0
  

  # UI Components
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  
  # Date & Time
  intl: ^0.18.1
  
  # Utilities
  permission_handler: ^11.2.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.0
  
  # Chat & Real-time
  socket_io_client: ^2.0.3
  
  google_fonts: ^6.2.1
  # Maps (if needed for property location)
  # google_maps_flutter: ^2.5.3
  # geolocator: ^11.0.0
  flutter_local_notifications: ^17.0.0
  # PDF & Documents
  # flutter_pdfview: ^1.3.2
  
  # Video Player (for property videos)
  video_player: ^2.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1


flutter:
  uses-material-design: true

  
  # Assets
  assets:
    # Onboarding Images
    - assets/onboarding1.jpg
    - assets/onboarding2.jpg
    - assets/onboarding3.jpg
    - assets/logo.png
    
    # App Logo & Icons
    # Lottie Animations (optional)
    # - assets/animations/
    
